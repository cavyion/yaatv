name: Installer health

# yaatv --install-ffmpeg depends on third-party FFmpeg artifact servers whose
# retention policies can break silently. Regular CI installs FFmpeg through the
# package manager and never exercises the installer, so this job runs the real
# installer on every supported release platform on a schedule instead.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install FFmpeg on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: ubuntu-latest
          - os: macos-15-intel
          - os: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install yaatv
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Install FFmpeg through yaatv
        run: yaatv --install-ffmpeg

      - name: Check installed tools
        run: yaatv --scry
