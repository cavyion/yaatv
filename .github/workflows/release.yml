name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Pre-release verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Verify release commit is on main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Error: Release commit ${GITHUB_SHA} is not reachable from origin/main." >&2
            exit 1
          fi
          echo "Commit ${GITHUB_SHA} is verified on origin/main."

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(python - <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          sys.path.insert(0, "src")
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          from yaatv import __version__
          if pyproject != __version__:
              raise SystemExit(f"pyproject.toml version {pyproject} does not match yaatv.__version__ {__version__}")
          print(pyproject)
          PY
          )"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package version $package_version."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run security and quality gates
        run: |
          python -m ruff check .
          python -m mypy
          python -m bandit -c pyproject.toml -r src
          python -m pip_audit . --strict

      - name: Run tests
        run: python -m pytest

  build:
    name: Build ${{ matrix.package_name }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            package_name: yaatv-windows-x64
            executable_name: yaatv
            extension: .exe
          - os: ubuntu-latest
            package_name: yaatv-linux-x64
            executable_name: yaatv-linux
            extension: ""
          - os: macos-15-intel
            package_name: yaatv-macos-x64
            executable_name: yaatv-macos
            extension: ""
          - os: macos-15
            package_name: yaatv-macos-arm64
            executable_name: yaatv-macos-arm64
            extension: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          PY
          )"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $package_version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" pyinstaller

      - name: Smoke test CLI
        run: |
          yaatv --version
          python -m yaatv --version

      - name: Run tests
        run: python -m pytest

      - name: Prepare FFmpeg release notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > FFMPEG_BUILD_INFO.txt
          import os
          import platform

          from yaatv.cli import (
              LINUX_FFMPEG_ARCHIVE_SHA256,
              LINUX_FFMPEG_ARCHIVE_URL,
              LINUX_FFPROBE_ARCHIVE_SHA256,
              LINUX_FFPROBE_ARCHIVE_URL,
              MACOS_ARM64_FFMPEG_ARCHIVE_SHA256,
              MACOS_ARM64_FFMPEG_ARCHIVE_URL,
              MACOS_ARM64_FFPROBE_ARCHIVE_SHA256,
              MACOS_ARM64_FFPROBE_ARCHIVE_URL,
              MACOS_FFMPEG_ARCHIVE_SHA256,
              MACOS_FFMPEG_ARCHIVE_URL,
              MACOS_FFPROBE_ARCHIVE_SHA256,
              MACOS_FFPROBE_ARCHIVE_URL,
              WINDOWS_FFMPEG_ARCHIVE_SHA256,
              WINDOWS_FFMPEG_ARCHIVE_URL,
          )

          runner_os = os.environ["RUNNER_OS"]

          print("The yaatv release executable does not bundle FFmpeg or FFprobe.")
          print("Run yaatv --install-ffmpeg to install the app-managed FFmpeg tools.")
          print()
          print(f"Runner OS: {runner_os}")

          if runner_os == "Windows":
              print(f"Installer archive source: {WINDOWS_FFMPEG_ARCHIVE_URL}")
              print(f"Installer archive sha256: {WINDOWS_FFMPEG_ARCHIVE_SHA256}")
              print(r"Install path: %LOCALAPPDATA%\yaatv\bin")
              print("Extracted files: ffmpeg.exe, ffprobe.exe")
          elif runner_os == "Linux":
              print(f"Installer ffmpeg source: {LINUX_FFMPEG_ARCHIVE_URL}")
              print(f"Installer ffmpeg sha256: {LINUX_FFMPEG_ARCHIVE_SHA256}")
              print(f"Installer ffprobe source: {LINUX_FFPROBE_ARCHIVE_URL}")
              print(f"Installer ffprobe sha256: {LINUX_FFPROBE_ARCHIVE_SHA256}")
              print("Install path: $XDG_DATA_HOME/yaatv/bin, or ~/.local/share/yaatv/bin")
              print("Extracted files: ffmpeg, ffprobe")
          elif runner_os == "macOS":
              if platform.machine().lower() in {"arm64", "aarch64"}:
                  print(f"Installer ffmpeg source: {MACOS_ARM64_FFMPEG_ARCHIVE_URL}")
                  print(f"Installer ffmpeg sha256: {MACOS_ARM64_FFMPEG_ARCHIVE_SHA256}")
                  print(f"Installer ffprobe source: {MACOS_ARM64_FFPROBE_ARCHIVE_URL}")
                  print(f"Installer ffprobe sha256: {MACOS_ARM64_FFPROBE_ARCHIVE_SHA256}")
              else:
                  print(f"Installer ffmpeg source: {MACOS_FFMPEG_ARCHIVE_URL}")
                  print(f"Installer ffmpeg sha256: {MACOS_FFMPEG_ARCHIVE_SHA256}")
                  print(f"Installer ffprobe source: {MACOS_FFPROBE_ARCHIVE_URL}")
                  print(f"Installer ffprobe sha256: {MACOS_FFPROBE_ARCHIVE_SHA256}")
              print("Install path: ~/Library/Application Support/yaatv/bin")
              print("Extracted files: ffmpeg, ffprobe")
          else:
              raise SystemExit(f"Unsupported runner OS: {runner_os}")

          print()
          print("FFmpeg project source: https://git.ffmpeg.org/ffmpeg.git")
          print("FFmpeg legal information: https://ffmpeg.org/legal.html")
          PY

      - name: Build executable
        shell: bash
        run: |
          python -c "from pathlib import Path; Path('yaatv_launcher.py').write_text('from yaatv.cli import main\nraise SystemExit(main())\n', encoding='utf-8')"
          separator=":"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            separator=";"
          fi
          pyinstaller_args=(
            --noconfirm
            --onedir
            --name "${{ matrix.executable_name }}${{ matrix.extension }}"
            --add-data "THIRD_PARTY_LICENSES.txt${separator}."
            --add-data "FFMPEG_BUILD_INFO.txt${separator}."
            --exclude-module numpy
            yaatv_launcher.py
          )
          pyinstaller "${pyinstaller_args[@]}"

      - name: Smoke test executable
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              executable="dist/${{ matrix.executable_name }}.exe/${{ matrix.executable_name }}.exe"
              ;;
            *)
              executable="dist/${{ matrix.executable_name }}/${{ matrix.executable_name }}"
              ;;
          esac
          python - <<'PY'
          import math
          import struct
          import wave

          duration = 3
          sample_rate = 48000
          frame_count = duration * sample_rate
          with wave.open("smoke-audio.wav", "wb") as audio:
              audio.setnchannels(2)
              audio.setsampwidth(2)
              audio.setframerate(sample_rate)
              frames = bytearray()
              for index in range(frame_count):
                  sample = int(32767 * 0.2 * math.sin(2 * math.pi * 440 * index / sample_rate))
                  packed = struct.pack("<h", sample)
                  frames.extend(packed)
                  frames.extend(packed)
              audio.writeframes(frames)
          PY
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            chmod +x "$executable"
          fi
          "$executable" --version
          case "$RUNNER_OS" in
            Windows)
              mkdir -p smoke-localappdata
              export LOCALAPPDATA="$(cygpath -w "$PWD/smoke-localappdata")"
              ;;
            Linux)
              mkdir -p smoke-xdg-data
              export XDG_DATA_HOME="$PWD/smoke-xdg-data"
              ;;
            macOS)
              mkdir -p smoke-home
              export HOME="$PWD/smoke-home"
              ;;
            *)
              echo "Unsupported runner OS: $RUNNER_OS" >&2
              exit 1
              ;;
          esac
          "$executable" --install-ffmpeg
          "$executable" \
            --audio smoke-audio.wav \
            --image docs/docs-assets/yaatv-sample.jpg \
            --output smoke-output.mp4 \
            --resolution 1080p \
            --no-warn

      - name: Package release ZIP
        shell: bash
        run: |
          set -euo pipefail
          package_dir="package/${{ matrix.package_name }}"
          mkdir -p "$package_dir" release-assets
          case "$RUNNER_OS" in
            Windows)
              cp -a dist/${{ matrix.executable_name }}.exe/* "$package_dir/"
              ;;
            *)
              cp -a dist/${{ matrix.executable_name }}/* "$package_dir/"
              ;;
          esac
          cp LICENSE THIRD_PARTY_LICENSES.txt FFMPEG_BUILD_INFO.txt "$package_dir/"
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path("package") / "${{ matrix.package_name }}"
          output = Path("release-assets") / "${{ matrix.package_name }}.zip"
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(root).as_posix())
          PY

      - name: Upload release package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package_name }}
          path: release-assets/${{ matrix.package_name }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [gate, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums manifest
        shell: bash
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum *.zip > SHA256SUMS)

      - name: Sign checksums with PGP
        env:
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${PGP_PRIVATE_KEY:-}" ]; then
            echo "Importing PGP private key..."
            echo "$PGP_PRIVATE_KEY" | gpg --batch --import
            if [ -n "${PGP_PASSPHRASE:-}" ]; then
              gpg --batch --yes --pinentry-mode loopback --passphrase "$PGP_PASSPHRASE" --armor --detach-sign release-assets/SHA256SUMS
            else
              gpg --batch --yes --armor --detach-sign release-assets/SHA256SUMS
            fi
            echo "Created SHA256SUMS.asc signature."
          else
            echo "No PGP_PRIVATE_KEY secret configured; skipping detached PGP signature."
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*.zip

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* --generate-notes --title "$TAG_NAME"
          fi
